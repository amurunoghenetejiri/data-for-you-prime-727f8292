<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1dd1a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="#000d1a"/>
  
  <!-- Main D4 Logo -->
  <g transform="translate(300, 200)">
    <!-- D Character with speed lines -->
    <g transform="translate(-60, 0)">
      <path d="M -30,-50 L 20,-50 Q 60,-50 60,0 Q 60,50 20,50 L -30,50 Z" 
            fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-50" y1="-35" x2="-5" y2="-35" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
      <line x1="-55" y1="-5" x2="0" y2="-5" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
      <line x1="-50" y1="25" x2="-10" y2="25" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    </g>
    
    <!-- Number 4 -->
    <g transform="translate(80, 0)">
      <path d="M 10,-50 L 60,50 M 60,50 L 60,-15 M -20,20 L 70,20" 
            fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Brand Name -->
  <text x="580" y="280" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white" letter-spacing="8">
    DATA
    <tspan fill="url(#grad)">4</tspan>ME
  </text>
  
  <!-- Tagline -->
  <text x="580" y="360" font-family="Arial, sans-serif" font-size="36" fill="url(#grad)" letter-spacing="4">
    FAST. SECURE. RELIABLE.
  </text>
  
  <!-- Feature Icons Row -->
  <g transform="translate(580, 450)">
    <!-- WiFi Icon (Data) -->
    <g transform="translate(-250, 0)">
      <path d="M 0,-15 Q 20,-35 40,-15 M 8,-8 Q 20,-20 32,-8 M 16,-2 Q 20,-7 24,-2 M 20,5 L 20,10" 
            stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="0" y="35" font-family="Arial" font-size="20" fill="white" text-anchor="middle">DATA</text>
    </g>
    
    <!-- Signal Icon (Airtime) -->
    <g transform="translate(-80, 0)">
      <rect x="5" y="5" width="6" height="20" fill="url(#grad)" rx="2"/>
      <rect x="14" y="-5" width="6" height="30" fill="url(#grad)" rx="2" opacity="0.8"/>
      <rect x="23" y="-15" width="6" height="40" fill="url(#grad)" rx="2" opacity="0.6"/>
      <text x="15" y="40" font-family="Arial" font-size="20" fill="white" text-anchor="middle">AIRTIME</text>
    </g>
    
    <!-- Wallet Icon (Pay Bills) -->
    <g transform="translate(80, 0)">
      <rect x="0" y="0" width="30" height="20" rx="2" stroke="url(#grad)" stroke-width="2" fill="none"/>
      <rect x="2" y="8" width="26" height="8" rx="1" fill="url(#grad)" opacity="0.3"/>
      <circle cx="24" cy="12" r="2" fill="url(#grad)"/>
      <text x="15" y="40" font-family="Arial" font-size="20" fill="white" text-anchor="middle">PAY BILLS</text>
    </g>
    
    <!-- Shield Icon (Secure) -->
    <g transform="translate(250, 0)">
      <path d="M 15,0 L 30,8 L 30,20 Q 30,28 15,32 Q 0,28 0,20 L 0,8 Z" 
            stroke="url(#grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 12,16 L 15,19 L 20,13" stroke="url(#grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="15" y="40" font-family="Arial" font-size="20" fill="white" text-anchor="middle">SECURE</text>
    </g>
  </g>
</svg>