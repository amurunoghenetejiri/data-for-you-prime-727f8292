<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1dd1a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="#000d1a" rx="50"/>
  
  <!-- Main D4 Logo -->
  <g transform="translate(128, 128)">
    <!-- D Character -->
    <g transform="translate(-40, 0)">
      <path d="M -15,-35 L 15,-35 Q 35,-35 35,0 Q 35,35 15,35 L -15,35 Z" 
            fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-25" y1="-25" x2="5" y2="-25" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <line x1="-28" y1="-5" x2="8" y2="-5" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <line x1="-25" y1="15" x2="0" y2="15" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    </g>
    
    <!-- Number 4 -->
    <g transform="translate(45, 0)">
      <path d="M 5,-35 L 35,35 M 35,35 L 35,-10 M -10,15 L 40,15" 
            fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>