<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00b8b8"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background circle -->
  <rect width="512" height="512" fill="#0a0a0a" rx="80"/>
  
  <!-- Speed D4 Logo -->
  <g transform="translate(256,256)">
    <!-- Speed lines left -->
    <g opacity="0.9">
      <line x1="-140" y1="-45" x2="-85" y2="-45" stroke="#00f5ff" stroke-width="18" stroke-linecap="round"/>
      <line x1="-155" y1="-15" x2="-75" y2="-15" stroke="#00f5ff" stroke-width="14" stroke-linecap="round"/>
      <line x1="-145" y1="20" x2="-80" y2="20" stroke="#00f5ff" stroke-width="16" stroke-linecap="round"/>
    </g>
    
    <!-- D4 Text -->
    <text x="0" y="45" font-family="Arial Black, sans-serif" font-size="195" font-weight="900" fill="url(#gradient)" text-anchor="middle" dominant-baseline="middle">D4</text>
  </g>
</svg>
