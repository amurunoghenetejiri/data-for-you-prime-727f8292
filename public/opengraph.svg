<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1dd1a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1929;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradBg)"/>
  
  <!-- Gradient overlay accent -->
  <circle cx="0" cy="0" r="400" fill="url(#grad)" opacity="0.05"/>
  <circle cx="1200" cy="630" r="400" fill="url(#grad)" opacity="0.05"/>
  
  <!-- Main D4 Logo Left -->
  <g transform="translate(150, 200)">
    <!-- D Character -->
    <g transform="translate(-40, 0)">
      <path d="M -15,-35 L 15,-35 Q 35,-35 35,0 Q 35,35 15,35 L -15,35 Z" 
            fill="none" stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-25" y1="-25" x2="5" y2="-25" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      <line x1="-28" y1="-5" x2="8" y2="-5" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
      <line x1="-25" y1="15" x2="0" y2="15" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    </g>
    
    <!-- Number 4 -->
    <g transform="translate(45, 0)">
      <path d="M 5,-35 L 35,35 M 35,35 L 35,-10 M -10,15 L 40,15" 
            fill="none" stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Brand Name -->
  <text x="400" y="220" font-family="Arial, Helvetica, sans-serif" font-size="140" font-weight="bold" fill="white" letter-spacing="6">
    DATA
    <tspan fill="url(#grad)">4</tspan>ME
  </text>
  
  <!-- Tagline -->
  <text x="400" y="290" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="url(#grad)" letter-spacing="3" font-weight="600">
    FAST. SECURE. RELIABLE.
  </text>
  
  <!-- Description -->
  <text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#b0bec5">
    Buy Data • Airtime • Pay Bills Instantly
  </text>
  
  <!-- Feature Icons Row -->
  <g transform="translate(400, 450)">
    <!-- WiFi Icon (Data) -->
    <g transform="translate(0, 0)">
      <path d="M 0,-15 Q 20,-35 40,-15 M 8,-8 Q 20,-20 32,-8 M 16,-2 Q 20,-7 24,-2 M 20,5 L 20,10" 
            stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="20" y="45" font-family="Arial" font-size="20" fill="white" text-anchor="middle" font-weight="600">DATA</text>
    </g>
    
    <!-- Signal Icon (Airtime) -->
    <g transform="translate(150, 0)">
      <rect x="5" y="5" width="8" height="20" fill="url(#grad)" rx="2"/>
      <rect x="16" y="-5" width="8" height="30" fill="url(#grad)" rx="2" opacity="0.8"/>
      <rect x="27" y="-15" width="8" height="40" fill="url(#grad)" rx="2" opacity="0.6"/>
      <text x="20" y="45" font-family="Arial" font-size="20" fill="white" text-anchor="middle" font-weight="600">AIRTIME</text>
    </g>
    
    <!-- Wallet Icon (Pay Bills) -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="35" height="25" rx="3" stroke="url(#grad)" stroke-width="3" fill="none"/>
      <rect x="3" y="10" width="29" height="10" rx="1" fill="url(#grad)" opacity="0.3"/>
      <circle cx="28" cy="15" r="3" fill="url(#grad)"/>
      <text x="17" y="45" font-family="Arial" font-size="20" fill="white" text-anchor="middle" font-weight="600">PAY BILLS</text>
    </g>
    
    <!-- Shield Icon (Secure) -->
    <g transform="translate(450, 0)">
      <path d="M 18,0 L 35,10 L 35,25 Q 35,35 18,40 Q 0,35 0,25 L 0,10 Z" 
            stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 14,20 L 18,24 L 24,16" stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="17" y="45" font-family="Arial" font-size="20" fill="white" text-anchor="middle" font-weight="600">SECURE</text>
    </g>
  </g>
</svg>