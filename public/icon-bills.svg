<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1dd1a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="64" cy="64" r="60" fill="#000d1a" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- Wallet Icon -->
  <g transform="translate(64, 64)">
    <rect x="0" y="0" width="30" height="20" rx="2" stroke="url(#grad)" stroke-width="2" fill="none"/>
    <rect x="2" y="8" width="26" height="8" rx="1" fill="url(#grad)" opacity="0.3"/>
    <circle cx="24" cy="12" r="2" fill="url(#grad)"/>
  </g>
